<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>flux</title>
  <style>
    :root {
      --bg-body: #f5f7fa;
      --bg-sidebar: #ffffff;
      --bg-topbar: #ffffff;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-box: #f4f6f8;
      --bg-input: #ffffff;
      --text-main: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --border-color: #e5e7eb;
      --border-subtle: #eef0f4;
      --primary: #006fee;
      --primary-hover: #005bc4;
      --primary-soft: #dcebff;
      --primary-text: #006fee;
      --purple: #7828c8;
      --purple-soft: #f2e8ff;
      --purple-text: #7828c8;
      --success: #17c964;
      --success-soft: #def7ec;
      --success-text: #0e793c;
      --warning: #f5a524;
      --warning-soft: #fef3c7;
      --warning-text: #b45309;
      --danger: #f31260;
      --danger-soft: #fde2e8;
      --danger-text: #c20e4d;
      --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.04);
      --shadow-modal: 0 12px 36px rgba(0, 0, 0, 0.14);
      --radius-card: 14px;
      --radius-inner: 10px;
      --radius-btn: 9px;
    }

    [data-theme="dark"] {
      --bg-body: #0b0f17;
      --bg-sidebar: #111827;
      --bg-topbar: #111827;
      --bg-card: #182232;
      --bg-subtle: #111827;
      --bg-box: #0f172a;
      --bg-input: #0f172a;
      --text-main: #f9fafb;
      --text-secondary: #d1d5db;
      --text-muted: #6b7280;
      --border-color: #263347;
      --border-subtle: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-soft: rgba(59, 130, 246, 0.18);
      --primary-text: #60a5fa;
      --purple: #9333ea;
      --purple-soft: rgba(147, 51, 234, 0.2);
      --purple-text: #c084fc;
      --success: #22c55e;
      --success-soft: rgba(34, 197, 94, 0.18);
      --success-text: #4ade80;
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.18);
      --warning-text: #fbbf24;
      --danger: #f43f5e;
      --danger-soft: rgba(244, 63, 94, 0.18);
      --danger-text: #fb7185;
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.35);
      --shadow-modal: 0 14px 40px rgba(0, 0, 0, 0.65);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      font-size: 13.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* 登录视图 */
    .login-wrap {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 80% 15%, var(--primary-soft), var(--bg-body) 55%);
    }
    .login-card {
      width: 100%;
      max-width: 390px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 34px 30px;
      box-shadow: var(--shadow-modal);
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }
    .login-logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--text-main);
      color: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
    }

    /* 主框架：PC 全宽撑满 + 移动端侧滑抽屉 */
    .app-layout {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }
    .sidebar {
      width: 210px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      transition: transform 0.25s ease;
    }
    .brand-header {
      height: 58px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      font-weight: 900;
      font-size: 17px;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-ver {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: -2px;
    }
    .nav-list {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 14px;
      border-radius: 10px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 0.15s ease;
      user-select: none;
    }
    .nav-item:hover {
      background: var(--bg-subtle);
      color: var(--text-main);
    }
    .nav-item.active {
      background: var(--primary-soft);
      color: var(--primary-text);
      font-weight: 600;
    }
    .nav-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 14px 20px;
      font-size: 11.5px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
    }

    .main-area {
      flex: 1;
      width: calc(100% - 210px);
      margin-left: 210px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .topbar {
      height: 56px;
      width: 100%;
      background: var(--bg-topbar);
      border-bottom: 1px solid var(--border-color);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 35;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mobile-menu-btn {
      display: none;
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-menu-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .user-menu-btn:hover { background: var(--bg-subtle); }

    .content-container {
      width: 100%;
      padding: 20px 24px 36px;
    }

    /* 顶部操作栏 */
    .page-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      width: 100%;
    }
    .page-toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    /* 按钮系统 (贴合原版柔和色块风格) */
    .btn {
      border: none;
      outline: none;
      padding: 7px 15px;
      border-radius: var(--radius-btn);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-soft-blue { background: var(--primary-soft); color: var(--primary-text); }
    .btn-soft-blue:hover { filter: brightness(0.95); }
    .btn-soft-green { background: var(--success-soft); color: var(--success-text); }
    .btn-soft-green:hover { filter: brightness(0.95); }
    .btn-soft-amber { background: var(--warning-soft); color: var(--warning-text); }
    .btn-soft-amber:hover { filter: brightness(0.95); }
    .btn-soft-pink { background: var(--danger-soft); color: var(--danger-text); }
    .btn-soft-pink:hover { filter: brightness(0.95); }
    .btn-ghost {
      background: var(--bg-box);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }
    .btn-ghost:hover { color: var(--text-main); }

    /* 徽章标签 */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.4;
    }
    .badge-blue { background: var(--primary-soft); color: var(--primary-text); }
    .badge-purple { background: var(--purple-soft); color: var(--purple-text); }
    .badge-green { background: var(--success-soft); color: var(--success-text); }
    .badge-amber { background: var(--warning-soft); color: var(--warning-text); }
    .badge-pink { background: var(--danger-soft); color: var(--danger-text); }

    /* 1. 仪表板样式 (1:1 对应原版 Dashboard) */
    .dash-top-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      margin-bottom: 18px;
    }
    .dash-stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 18px 20px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 112px;
    }
    .dash-stat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      font-size: 12.5px;
    }
    .dash-stat-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .dash-stat-val {
      font-size: 21px;
      font-weight: 800;
      color: var(--text-main);
      margin: 6px 0;
    }
    .dash-stat-bar {
      height: 5px;
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 999px;
      margin: 4px 0;
    }
    .dash-stat-foot {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .dash-section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: var(--shadow-card);
      width: 100%;
      margin-bottom: 18px;
    }
    .dash-section-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .dash-tunnel-group {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      background: var(--bg-card);
    }
    .dash-tunnel-group:last-child { margin-bottom: 0; }
    .dash-tunnel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 14px;
    }
    .dash-fwd-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 14px;
    }
    .dash-fwd-box {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      background: var(--bg-card);
    }
    .dash-addr-in {
      background: var(--success-soft);
      color: var(--success-text);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dash-addr-out {
      background: var(--primary-soft);
      color: var(--primary-text);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dash-metrics-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11.5px;
    }

    /* 2. 转发管理 & 隧道管理 & 限速管理 卡片网格 (1:1 对应原版卡片) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
      width: 100%;
    }
    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 18px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .item-card-title {
      font-weight: 700;
      font-size: 14.5px;
      color: var(--text-main);
    }
    .item-card-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .gray-info-bar {
      background: var(--bg-box);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12.5px;
      color: var(--text-secondary);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: border-color 0.15s;
    }
    .gray-info-bar:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }
    .tunnel-node-box {
      background: var(--bg-box);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 10px 12px;
    }
    .tunnel-node-label {
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .tunnel-node-name {
      font-weight: 700;
      font-size: 13px;
      color: var(--text-main);
      margin-top: 2px;
    }
    .tunnel-node-ip {
      font-size: 12px;
      color: var(--text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .pills-row-3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 2px;
    }
    .card-btn-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 4px;
    }

    /* 3. 节点监控 5 列自适应网格 (1:1 对应原版 Node 页面) */
    .node-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 16px;
      width: 100%;
    }
    .node-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 18px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .kv-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .kv-val {
      font-weight: 600;
      color: var(--text-main);
      text-align: right;
      max-width: 68%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 2px;
    }
    .meter-head {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .progress-track {
      height: 5px;
      background: var(--bg-box);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--success);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .speed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .speed-box {
      background: var(--bg-box);
      border-radius: 8px;
      padding: 7px 6px;
      text-align: center;
    }
    .speed-box-label { font-size: 11px; color: var(--text-muted); }
    .speed-box-val { font-size: 12px; font-weight: 700; color: var(--text-main); margin-top: 2px; }
    .flow-box-up {
      background: var(--primary-soft);
      border: 1px solid rgba(0, 111, 238, 0.2);
      color: var(--primary-text);
      border-radius: 8px;
      padding: 7px 6px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
    }
    .flow-box-down {
      background: var(--success-soft);
      border: 1px solid rgba(23, 201, 100, 0.25);
      color: var(--success-text);
      border-radius: 8px;
      padding: 7px 6px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
    }

    /* 表单与输入框 */
    .input, .select, .textarea {
      width: 100%;
      padding: 9px 13px;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); }
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    .form-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

    /* 开关 Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 21px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--text-muted);
      transition: .2s;
      border-radius: 21px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 15px;
      width: 15px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(17px); }

    /* 模态弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-modal);
      padding: 22px 24px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-title { font-size: 16px; font-weight: 700; margin: 0; }
    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .proto-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-box);
    }
    .proto-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .alert-box {
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 12px;
      margin-top: 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.5;
    }
    .alert-danger { background: var(--danger-soft); color: var(--danger-text); }
    .alert-info { background: var(--primary-soft); color: var(--primary-text); }

    .code-box {
      background: var(--bg-box);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      word-break: break-all;
      line-height: 1.6;
    }

    /* 列表视图表格 */
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-box);
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
    }

    .empty-state {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 56px 20px;
      text-align: center;
      width: 100%;
    }

    /* 移动端抽屉遮罩 */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 45;
    }

    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      padding: 10px 16px;
      border-radius: 9px;
      box-shadow: var(--shadow-modal);
      font-weight: 600;
      font-size: 12.5px;
    }

    /* 响应式适配：平板与手机端优化 */
    @media (max-width: 1100px) {
      .dash-top-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 820px) {
      .sidebar {
        transform: translateX(-100%);
        width: 230px;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .drawer-backdrop.open {
        display: block;
      }
      .main-area {
        width: 100%;
        margin-left: 0;
      }
      .mobile-menu-btn {
        display: inline-flex;
      }
      .topbar {
        padding: 0 14px;
      }
      .content-container {
        padding: 14px 14px 28px;
      }
      .dash-top-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .cards-grid, .node-grid, .dash-fwd-grid {
        grid-template-columns: 1fr;
      }
      .proto-grid {
        grid-template-columns: 1fr;
      }
      .modal-panel {
        padding: 18px 16px;
        max-height: 92vh;
      }
    }
  </style>
</head>
<body>
  <div id="toastArea" class="toast-container"></div>
  <div id="app"></div>

  <script>
    const state = {
      token: localStorage.getItem('flux_token') || '',
      username: localStorage.getItem('flux_user') || 'admin_user',
      theme: localStorage.getItem('flux_theme') || 'light',
      activeTab: localStorage.getItem('flux_tab') || 'dashboard',
      forwardViewMode: localStorage.getItem('flux_fwd_view') || 'card', // 'card' | 'list'
      drawerOpen: false,
      searchQuery: '',
      dashboard: {
        userInfo: { inFlow: 0, outFlow: 0 },
        nodeSummary: { total: 0, online: 0, offline: 0 },
        tunnelSummary: { total: 0 },
        forwards: [],
        statisticsFlows: []
      },
      nodes: [],
      tunnels: [],
      forwards: [],
      speedLimits: [],
      configs: {
        app_name: 'flux',
        ip: '',
        panel_domain: '',
        block_ip_access: 'false',
        agent_mode: 'light'
      },
      ws: null
    };

    document.documentElement.setAttribute('data-theme', state.theme);

    function showToast(msg, type = 'info') {
      const area = document.getElementById('toastArea');
      const el = document.createElement('div');
      el.className = 'toast';
      if (type === 'error') el.style.borderLeftColor = 'var(--danger)';
      if (type === 'success') el.style.borderLeftColor = 'var(--success)';
      el.textContent = msg;
      area.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function formatBytes(bytes) {
      const b = Number(bytes) || 0;
      if (b <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(units.length - 1, Math.floor(Math.log(b) / Math.log(1024)));
      return (b / Math.pow(1024, i)).toFixed(2) + ' ' + units[i];
    }

    function formatSpeed(bytesPerSec) {
      const b = Number(bytesPerSec) || 0;
      if (b <= 0) return '0 B/s';
      return formatBytes(b) + '/s';
    }

    function formatUptime(seconds) {
      const s = Number(seconds) || 0;
      if (!s || s <= 0) return '-';
      const days = Math.floor(s / 86400);
      const hours = Math.floor((s % 86400) / 3600);
      if (days > 0) return `${days}天${hours}小时`;
      const mins = Math.floor((s % 3600) / 60);
      return `${hours}小时${mins}分`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function apiPost(path, data = {}) {
      const headers = { 'Content-Type': 'application/json' };
      if (state.token) headers['Authorization'] = state.token;
      const resp = await fetch('/api/v1' + path, {
        method: 'POST',
        headers,
        body: JSON.stringify(data)
      });
      if (resp.status === 401) {
        logout();
        throw new Error('Unauthorized');
      }
      return await resp.json();
    }

    function copyText(text, label = '地址') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(`已复制${label}: ${text}`, 'success'));
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast(`已复制${label}: ${text}`, 'success');
      }
    }

    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      localStorage.setItem('flux_theme', state.theme);
      document.documentElement.setAttribute('data-theme', state.theme);
      renderApp();
    }

    function toggleDrawer(force) {
      state.drawerOpen = typeof force === 'boolean' ? force : !state.drawerOpen;
      renderApp();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      state.drawerOpen = false;
      localStorage.setItem('flux_tab', tab);
      renderApp();
      refreshActiveTabData();
    }

    function toggleForwardViewMode() {
      state.forwardViewMode = state.forwardViewMode === 'card' ? 'list' : 'card';
      localStorage.setItem('flux_fwd_view', state.forwardViewMode);
      renderApp();
    }

    function logout() {
      state.token = '';
      localStorage.removeItem('flux_token');
      if (state.ws) {
        try { state.ws.close(); } catch (e) {}
        state.ws = null;
      }
      renderApp();
    }

    // ======================= WebSocket 实时监控 =======================
    function initRealtimeWs() {
      if (!state.token || state.ws) return;
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${proto}//${location.host}/system-info?type=0&secret=${encodeURIComponent(state.token)}`;
      try {
        const ws = new WebSocket(wsUrl);
        state.ws = ws;
        ws.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            const nodeId = Number(msg.id);
            const targetNode = state.nodes.find(n => Number(n.id) === nodeId);
            if (!targetNode) return;
            if (msg.type === 'status') {
              targetNode.status = Number(msg.data) === 1 ? 1 : 0;
              if ((state.activeTab === 'node' || state.activeTab === 'dashboard') && !document.querySelector('.modal-backdrop')) {
                renderApp();
              }
            } else if (msg.type === 'info') {
              const info = typeof msg.data === 'string' ? JSON.parse(msg.data) : msg.data;
              const now = Date.now();
              const prev = targetNode.systemInfo;
              const rx = Number(info.bytes_received) || 0;
              const tx = Number(info.bytes_transmitted) || 0;
              let downSpeed = 0, upSpeed = 0;
              if (prev && prev.ts && now > prev.ts) {
                const dt = (now - prev.ts) / 1000;
                if (dt > 0) {
                  downSpeed = Math.max(0, Math.round((rx - prev.downloadTraffic) / dt));
                  upSpeed = Math.max(0, Math.round((tx - prev.uploadTraffic) / dt));
                }
              }
              targetNode.status = 1;
              targetNode.systemInfo = {
                uptime: Number(info.uptime) || 0,
                cpuUsage: Number(Number(info.cpu_usage || 0).toFixed(1)),
                memoryUsage: Number(Number(info.memory_usage || 0).toFixed(1)),
                uploadTraffic: tx,
                downloadTraffic: rx,
                uploadSpeed: upSpeed,
                downloadSpeed: downSpeed,
                ts: now
              };
              if (state.activeTab === 'node' && !document.querySelector('.modal-backdrop')) {
                renderApp();
              }
            }
          } catch (e) {}
        };
        ws.onclose = () => {
          state.ws = null;
          if (state.token) setTimeout(initRealtimeWs, 4000);
        };
      } catch (e) {}
    }

    async function refreshActiveTabData() {
      if (!state.token) return;
      try {
        const [cfgRes, pkgRes, nodeRes, tunRes, fwdRes, limRes] = await Promise.all([
          apiPost('/config/list'),
          apiPost('/user/package'),
          apiPost('/node/list'),
          apiPost('/tunnel/list'),
          apiPost('/forward/list'),
          apiPost('/speed-limit/list')
        ]);
        if (cfgRes.code === 0 && cfgRes.data) {
          state.configs = Object.assign(state.configs, cfgRes.data);
          document.title = state.configs.app_name || 'flux';
        }
        if (pkgRes.code === 0 && pkgRes.data) state.dashboard = Object.assign(state.dashboard, pkgRes.data);
        if (nodeRes.code === 0 && Array.isArray(nodeRes.data)) state.nodes = nodeRes.data;
        if (tunRes.code === 0 && Array.isArray(tunRes.data)) state.tunnels = tunRes.data;
        if (fwdRes.code === 0 && Array.isArray(fwdRes.data)) state.forwards = fwdRes.data;
        if (limRes.code === 0 && Array.isArray(limRes.data)) state.speedLimits = limRes.data;
        if (!document.querySelector('.modal-backdrop')) renderApp();
      } catch (e) {}
    }

    // ======================= 主界面渲染 =======================
    function renderApp() {
      const root = document.getElementById('app');
      if (!state.token) {
        root.innerHTML = renderLoginView();
        return;
      }

      const appName = escapeHtml(state.configs.app_name || 'flux');

      root.innerHTML = `
        <div class="app-layout">
          <div class="drawer-backdrop ${state.drawerOpen ? 'open' : ''}" onclick="toggleDrawer(false)"></div>
          <aside class="sidebar ${state.drawerOpen ? 'open' : ''}">
            <div class="brand-header">
              <div>
                <div class="brand-logo">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 21h20L12 2zm0 5.8L17.5 18h-11L12 7.8z"/></svg>
                  <span>${appName}</span>
                </div>
                <div class="brand-ver">v1.4.3</div>
              </div>
            </div>
            <nav class="nav-list">
              ${renderNavItem('dashboard', '仪表板', '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>')}
              ${renderNavItem('forward', '转发管理', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>')}
              ${renderNavItem('tunnel', '隧道管理', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>')}
              ${renderNavItem('node', '节点监控', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 13l3-3 2 2 4-4M8 21h8"/></svg>')}
              ${renderNavItem('limit', '限速管理', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>')}
              ${renderNavItem('config', '网站配置', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>')}
            </nav>
            <div class="sidebar-footer">Powered by flux-panel</div>
          </aside>

          <div class="main-area">
            <header class="topbar">
              <div class="topbar-left">
                <button class="mobile-menu-btn" onclick="toggleDrawer()">☰</button>
              </div>
              <div class="topbar-right">
                <button class="btn btn-ghost" style="padding:5px 10px" onclick="toggleTheme()" title="切换明暗主题">${state.theme === 'light' ? '🌙' : '☀️'}</button>
                <button class="user-menu-btn" onclick="openPasswordModal()">
                  <span>${escapeHtml(state.username)}</span>
                  <span style="font-size:10px;color:var(--text-muted)">▼</span>
                </button>
                <button class="btn btn-soft-pink" style="padding:5px 11px" onclick="logout()">退出</button>
              </div>
            </header>

            <main class="content-container">
              ${renderCurrentTabContent()}
            </main>
          </div>
        </div>
        <div id="modalMount"></div>
      `;
    }

    function renderNavItem(key, label, svg) {
      const cls = state.activeTab === key ? 'nav-item active' : 'nav-item';
      return `<div class="${cls}" onclick="switchTab('${key}')">${svg}<span>${label}</span></div>`;
    }

    function renderLoginView() {
      return `
        <div class="login-wrap">
          <div class="login-card">
            <div class="login-logo">
              <div class="login-logo-mark">▲</div>
              <div>
                <div style="font-size:18px;font-weight:800">${escapeHtml(state.configs.app_name || 'flux')}</div>
                <div style="font-size:12px;color:var(--text-muted)">v1.4.3</div>
              </div>
            </div>
            <form onsubmit="handleLoginSubmit(event)">
              <div class="form-group">
                <label class="form-label">用户名</label>
                <input id="loginUser" class="input" type="text" placeholder="请输入管理员账号" value="admin_user" required />
              </div>
              <div class="form-group">
                <label class="form-label">密码</label>
                <input id="loginPwd" class="input" type="password" placeholder="请输入密码" required />
              </div>
              <button class="btn btn-primary" style="width:100%;padding:10px;margin-top:8px" type="submit">登录</button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPwd').value.trim();
      try {
        const res = await apiPost('/user/login', { username, password });
        if (res.code === 0 && res.data && res.data.token) {
          state.token = res.data.token;
          state.username = res.data.name || username;
          localStorage.setItem('flux_token', state.token);
          localStorage.setItem('flux_user', state.username);
          initRealtimeWs();
          await refreshActiveTabData();
          renderApp();
        } else {
          showToast(res.msg || '用户名或密码错误', 'error');
        }
      } catch (err) {
        showToast('登录失败', 'error');
      }
    }

    function renderCurrentTabContent() {
      switch (state.activeTab) {
        case 'dashboard': return renderDashboardTab();
        case 'forward': return renderForwardTab();
        case 'tunnel': return renderTunnelTab();
        case 'node': return renderNodeTab();
        case 'limit': return renderLimitTab();
        case 'config': return renderConfigTab();
        default: return renderDashboardTab();
      }
    }

    // ======================= 1. 仪表板 (1:1 对应原版 Dashboard) =======================
    function renderDashboardTab() {
      const d = state.dashboard;
      const inFlow = (d.userInfo && d.userInfo.inFlow) || 0;
      const outFlow = (d.userInfo && d.userInfo.outFlow) || 0;
      const totalUsedFlow = inFlow + outFlow;

      // 按隧道分组转发配置
      const tunnelMap = new Map();
      for (const f of state.forwards) {
        const tid = Number(f.tunnelId);
        if (!tunnelMap.has(tid)) {
          tunnelMap.set(tid, {
            tunnelId: tid,
            tunnelName: f.tunnelName || ('隧道#' + tid),
            forwards: []
          });
        }
        tunnelMap.get(tid).forwards.push(f);
      }
      const tunnelGroups = Array.from(tunnelMap.values());

      return `
        <div class="dash-top-grid">
          <div class="dash-stat-card">
            <div class="dash-stat-head">
              <span>总流量</span>
              <span class="dash-stat-icon badge-blue">⊞</span>
            </div>
            <div class="dash-stat-val">无限制</div>
            <div class="dash-stat-foot"><span>&nbsp;</span></div>
          </div>

          <div class="dash-stat-card">
            <div class="dash-stat-head">
              <span>已用流量</span>
              <span class="dash-stat-icon badge-green">↗</span>
            </div>
            <div class="dash-stat-val">${formatBytes(totalUsedFlow)}</div>
            <div class="dash-stat-bar"></div>
            <div class="dash-stat-foot">
              <span>无限制</span>
              <span style="cursor:pointer;color:var(--primary-text)" onclick="resetAllTraffic()">↻ 清零统计</span>
            </div>
          </div>

          <div class="dash-stat-card">
            <div class="dash-stat-head">
              <span>转发配额</span>
              <span class="dash-stat-icon badge-purple">↓</span>
            </div>
            <div class="dash-stat-val">无限制</div>
            <div class="dash-stat-foot"><span>在线节点: ${state.nodes.filter(n => Number(n.status) === 1).length} / ${state.nodes.length}</span></div>
          </div>

          <div class="dash-stat-card">
            <div class="dash-stat-head">
              <span>已用转发</span>
              <span class="dash-stat-icon badge-amber">🔗</span>
            </div>
            <div class="dash-stat-val">${state.forwards.length}</div>
            <div class="dash-stat-bar"></div>
            <div class="dash-stat-foot">
              <span>无限制</span>
              <span>活跃隧道: ${state.tunnels.length}</span>
            </div>
          </div>
        </div>

        <div class="dash-section-card">
          <div class="dash-section-title">
            <span style="color:var(--primary)">🕒</span>
            <span>24小时流量统计</span>
          </div>
          ${render24hChartSvg()}
        </div>

        <div class="dash-section-card">
          <div class="dash-section-title">
            <span style="color:var(--primary)">↓</span>
            <span>转发配置</span>
            <span class="badge" style="background:var(--bg-box);color:var(--text-secondary)">${state.forwards.length}</span>
          </div>
          ${tunnelGroups.length === 0 ? `
            <div style="text-align:center;color:var(--text-muted);padding:32px 0">暂无转发配置</div>
          ` : tunnelGroups.map(g => `
            <div class="dash-tunnel-group">
              <div class="dash-tunnel-head">
                <span>${escapeHtml(g.tunnelName)}</span>
                <span class="badge badge-blue">${g.forwards.length} 个转发</span>
              </div>
              <div class="dash-fwd-grid">
                ${g.forwards.map(f => {
                  const firstInIp = String(f.inIp || '').split(/[\n,]+/)[0] || '0.0.0.0';
                  const entryAddr = `${firstInIp}:${f.inPort}`;
                  const billable = (Number(f.outFlow) || 0) + (Number(f.inFlow) || 0);
                  return `
                    <div class="dash-fwd-box">
                      <div style="font-weight:700;margin-bottom:10px;font-size:13.5px">${escapeHtml(f.name)}</div>
                      <div class="dash-addr-in" onclick="copyText('${escapeHtml(entryAddr)}', '入口地址')">${escapeHtml(entryAddr)}</div>
                      <div style="text-align:center;color:var(--text-muted);font-size:12px;margin:4px 0">↓</div>
                      <div class="dash-addr-out" onclick="copyText('${escapeHtml(f.remoteAddr)}', '目标地址')">${escapeHtml(f.remoteAddr)}</div>
                      <div class="dash-metrics-3">
                        <div>
                          <div style="color:var(--text-muted)">上传</div>
                          <div style="color:var(--success-text);font-weight:700;margin-top:2px">${formatBytes(f.outFlow)}</div>
                        </div>
                        <div>
                          <div style="color:var(--text-muted)">下载</div>
                          <div style="color:var(--warning-text);font-weight:700;margin-top:2px">${formatBytes(f.inFlow)}</div>
                        </div>
                        <div>
                          <div style="color:var(--text-muted)">计费</div>
                          <div style="color:var(--primary-text);font-weight:700;margin-top:2px">${formatBytes(billable)}</div>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function render24hChartSvg() {
      const nowHour = new Date().getHours();
      const hours = [];
      for (let i = 23; i >= 0; i--) {
        const h = (nowHour - i + 24) % 24;
        hours.push(String(h).padStart(2, '0') + ':00');
      }

      const rawStats = Array.isArray(state.dashboard.statisticsFlows) ? state.dashboard.statisticsFlows : [];
      const values = hours.map((hLabel, idx) => {
        const match = rawStats.find(s => String(s.time || '').endsWith(hLabel));
        if (match) return Number(match.flow) || 0;
        if (idx === 23) {
          return (Number(state.dashboard.userInfo && state.dashboard.userInfo.inFlow) || 0) +
                 (Number(state.dashboard.userInfo && state.dashboard.userInfo.outFlow) || 0);
        }
        return 0;
      });

      const maxVal = Math.max(1024 * 1024, ...values);
      const width = 1200;
      const height = 230;
      const padLeft = 58;
      const padRight = 20;
      const padTop = 16;
      const padBottom = 30;
      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const pts = values.map((v, i) => {
        const x = padLeft + (i / 23) * plotW;
        const y = padTop + plotH - Math.min(1, v / maxVal) * plotH;
        return { x, y, v, label: hours[i] };
      });

      let pathD = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i];
        const p1 = pts[i + 1];
        const cx = ((p0.x + p1.x) / 2).toFixed(1);
        pathD += ` C ${cx} ${p0.y.toFixed(1)}, ${cx} ${p1.y.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
      }
      const areaD = `${pathD} L ${pts[pts.length - 1].x.toFixed(1)} ${padTop + plotH} L ${pts[0].x.toFixed(1)} ${padTop + plotH} Z`;

      const yTicks = [1, 0.75, 0.5, 0.25, 0].map(r => ({
        y: padTop + (1 - r) * plotH,
        label: r === 0 ? '0' : formatBytes(maxVal * r)
      }));

      return `
        <div style="width:100%;overflow:hidden">
          <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:230px;display:block">
            <defs>
              <linearGradient id="fluxAreaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
                <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0"/>
              </linearGradient>
            </defs>
            ${yTicks.map(t => `
              <line x1="${padLeft}" y1="${t.y}" x2="${width - padRight}" y2="${t.y}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="1"/>
              <text x="${padLeft - 8}" y="${t.y + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${t.label}</text>
            `).join('')}
            ${pts.map((p, i) => `
              <line x1="${p.x}" y1="${padTop}" x2="${p.x}" y2="${padTop + plotH}" stroke="var(--border-subtle)" stroke-dasharray="2 4" stroke-width="1"/>
              <text x="${p.x}" y="${height - 8}" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">${p.label}</text>
            `).join('')}
            <path d="${areaD}" fill="url(#fluxAreaGrad)"/>
            <path d="${pathD}" fill="none" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>
      `;
    }

    function renderNodeCard(node) {
      const online = Number(node.status) === 1;
      const sys = node.systemInfo || {};
      const cpu = online && sys.cpuUsage !== undefined ? Number(sys.cpuUsage).toFixed(1) + '%' : '-';
      const mem = online && sys.memoryUsage !== undefined ? Number(sys.memoryUsage).toFixed(1) + '%' : '-';
      const cpuPct = online && sys.cpuUsage ? Math.min(100, Number(sys.cpuUsage)) : 0;
      const memPct = online && sys.memoryUsage ? Math.min(100, Number(sys.memoryUsage)) : 0;
      const upSpeed = online && sys.uploadSpeed !== undefined ? formatSpeed(sys.uploadSpeed) : '-';
      const downSpeed = online && sys.downloadSpeed !== undefined ? formatSpeed(sys.downloadSpeed) : '-';
      const upTraffic = online && sys.uploadTraffic !== undefined ? formatBytes(sys.uploadTraffic) : '-';
      const downTraffic = online && sys.downloadTraffic !== undefined ? formatBytes(sys.downloadTraffic) : '-';
      const uptimeStr = online && sys.uptime ? formatUptime(sys.uptime) : '-';
      const firstInIp = String(node.ip || node.serverIp || '').split(/[\n,]+/)[0] || '-';

      return `
        <div class="node-card">
          <div class="item-card-head">
            <div>
              <div class="item-card-title">${escapeHtml(node.name)}</div>
              <div class="item-card-sub">${escapeHtml(node.serverIp)}</div>
            </div>
            <span class="badge ${online ? 'badge-green' : 'badge-pink'}">${online ? '在线' : '离线'}</span>
          </div>

          <div class="kv-row"><span>入口IP</span><span class="kv-val" title="${escapeHtml(node.ip)}">${escapeHtml(firstInIp)}</span></div>
          <div class="kv-row"><span>端口</span><span class="kv-val">${node.portSta || 1000}-${node.portEnd || 65535}</span></div>
          <div class="kv-row"><span>版本</span><span class="kv-val">${escapeHtml(node.version || '1.2.4')}</span></div>
          <div class="kv-row"><span>开机时间</span><span class="kv-val">${uptimeStr}</span></div>

          <div class="meter-grid">
            <div>
              <div class="meter-head"><span>CPU</span><span>${cpu}</span></div>
              <div class="progress-track"><div class="progress-bar" style="width:${cpuPct}%"></div></div>
            </div>
            <div>
              <div class="meter-head"><span>内存</span><span>${mem}</span></div>
              <div class="progress-track"><div class="progress-bar" style="width:${memPct}%"></div></div>
            </div>
          </div>

          <div class="speed-grid">
            <div class="speed-box">
              <div class="speed-box-label">上传</div>
              <div class="speed-box-val">${upSpeed}</div>
            </div>
            <div class="speed-box">
              <div class="speed-box-label">下载</div>
              <div class="speed-box-val">${downSpeed}</div>
            </div>
          </div>

          <div class="speed-grid">
            <div class="flow-box-up">
              <div style="font-size:10.5px;opacity:.85">↑ 上行流量</div>
              <div style="margin-top:2px">${upTraffic}</div>
            </div>
            <div class="flow-box-down">
              <div style="font-size:10.5px;opacity:.85">↓ 下行流量</div>
              <div style="margin-top:2px">${downTraffic}</div>
            </div>
          </div>

          <div class="card-btn-row-3">
            <button class="btn btn-soft-green" onclick="openInstallCommandModal(${node.id})">安装</button>

          <div class="modal-panel" style="max-width:440px">
            <div class="modal-header">
              <h3 class="modal-title">${rule ? '编辑限速' : '新增限速'}</h3>
              <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <form onsubmit="submitLimitForm(event, ${rule ? rule.id : 'null'})">
              <div class="form-group">
                <label class="form-label">规则名称</label>
                <input id="limName" class="input" placeholder="请输入规则名称" value="${escapeHtml(rule ? rule.name : '')}" required />
              </div>
              <div class="form-group">
                <label class="form-label">速度限制 (Mbps)</label>
                <input id="limSpeed" class="input" type="number" min="1" max="100000" value="${rule ? rule.speed : 100}" required />
              </div>
              <div class="form-group">
                <label class="form-label">绑定隧道</label>
                <select id="limTunnelId" class="select" required>
                  <option value="">请选择隧道</option>
                  ${state.tunnels.map(t => `<option value="${t.id}" ${rule && Number(rule.tunnelId) === Number(t.id) ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}
                </select>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeModal()">取消</button>
                <button type="submit" class="btn btn-primary">确定</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    async function submitLimitForm(e, editId) {
      e.preventDefault();
      const tunnelId = Number(document.getElementById('limTunnelId').value);
      const tun = state.tunnels.find(t => Number(t.id) === tunnelId);
      const res = await apiPost(editId ? '/speed-limit/update' : '/speed-limit/create', {
        id: editId,
        name: document.getElementById('limName').value.trim(),
        speed: Number(document.getElementById('limSpeed').value) || 100,
        tunnelId,
        tunnelName: tun ? tun.name : ''
      });
      if (res.code === 0) {
        showToast('限速规则已保存', 'success');
        closeModal();
        refreshActiveTabData();
      } else {
        showToast(res.msg || '保存失败', 'error');
      }
    }

    async function handleDeleteLimit(id) {
      if (!confirm('确认删除该限速规则吗？')) return;
      const res = await apiPost('/speed-limit/delete', { id });
      if (res.code === 0) {
        showToast('限速规则已删除', 'success');
        refreshActiveTabData();
      } else {
        showToast(res.msg || '删除失败', 'error');
      }
    }

    async function submitSiteConfig(e) {
      e.preventDefault();
      const domain = document.getElementById('cfgDomain').value.trim();
      const blockIp = document.getElementById('cfgBlockIp').checked;
      if (blockIp && !domain) {
        showToast('开启阻止 IP+端口 直接访问前，请先填写面板绑定域名', 'error');
        return;
      }
      const res = await apiPost('/config/update', {
        ip: document.getElementById('cfgIp').value.trim(),
        app_name: document.getElementById('cfgAppName').value.trim(),
        panel_domain: domain,
        block_ip_access: blockIp ? 'true' : 'false'
      });
      if (res.code === 0) {
        showToast('配置已保存', 'success');
        await refreshActiveTabData();
      } else {
        showToast(res.msg || '保存失败', 'error');
      }
    }

    async function handleExportBackup() {
      const res = await apiPost('/backup/export');
      if (res.code === 0 && res.data) {
        const blob = new Blob([JSON.stringify(res.data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const dateStr = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        a.download = `flux-backup-${dateStr}.json`;
        a.click();
        showToast('备份导出成功', 'success');
      } else {
        showToast('备份导出失败', 'error');
      }
    }

    async function handleImportBackupFile(evt) {
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const text = await file.text();
      let payload = {};
      if (file.name.endsWith('.sql') || text.includes('CREATE TABLE') || text.includes('INSERT INTO')) {
        payload = { sqlContent: text };
      } else {
        try {
          payload = JSON.parse(text);
        } catch (e) {
          showToast('备份文件格式错误', 'error');
          return;
        }
      }
      const res = await apiPost('/backup/import', payload);
      if (res.code === 0) {
        showToast(res.msg || '恢复成功', 'success');
        await refreshActiveTabData();
      } else {
        showToast(res.msg || '恢复失败', 'error');
      }
      evt.target.value = '';
    }

    function openPasswordModal() {
      const mount = document.getElementById('modalMount');
      mount.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal-panel" style="max-width:400px">
            <div class="modal-header">
              <h3 class="modal-title">修改管理员密码</h3>
              <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <form onsubmit="submitPasswordChange(event)">
              <div class="form-group">
                <label class="form-label">管理员用户名</label>
                <input id="pwdNewUser" class="input" value="${escapeHtml(state.username)}" required />
              </div>
              <div class="form-group">
                <label class="form-label">当前密码</label>
                <input id="pwdCurrent" class="input" type="password" required />
              </div>
              <div class="form-group">
                <label class="form-label">新密码</label>
                <input id="pwdNew" class="input" type="password" minlength="5" required />
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeModal()">取消</button>
                <button type="submit" class="btn btn-primary">确定</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    async function submitPasswordChange(e) {
      e.preventDefault();
      const newUsername = document.getElementById('pwdNewUser').value.trim();
      const currentPassword = document.getElementById('pwdCurrent').value.trim();
      const newPassword = document.getElementById('pwdNew').value.trim();
      const res = await apiPost('/user/updatePassword', { currentPassword, newUsername, newPassword });
      if (res.code === 0) {
        showToast('密码已更新，请重新登录', 'success');
        closeModal();
        logout();
      } else {
        showToast(res.msg || '修改失败', 'error');
      }
    }

    function closeModal() {
      const mount = document.getElementById('modalMount');
      if (mount) mount.innerHTML = '';
    }

    renderApp();
    if (state.token) {
      initRealtimeWs();
      refreshActiveTabData();
      setInterval(() => {
        if (state.token && !document.querySelector('.modal-backdrop')) {
          refreshActiveTabData();
        }
      }, 6000);
    }
  </script>
</body>
</html>
